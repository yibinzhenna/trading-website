[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Strategy backtesting and overfit detection"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
dev = ["pytest>=8.0", "httpx>=0.27", "quantlab[web]"]

[tool.setuptools.packages.find]
include = ["quantlab*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
