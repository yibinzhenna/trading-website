services:
  - type: web
    name: quantlab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker, deliberately. Jobs live in process memory, so a second
    # worker would 404 a job that is running perfectly well in its sibling.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: QUANTLAB_DATA_ROOT
        value: sampledata
      # Free tiers have an ephemeral filesystem; /tmp is the writable spot.
      - key: QUANTLAB_CACHE_ROOT
        value: /tmp/quantlab-cache
      # Admin endpoints (/cache, /jobs). Render generates a random 256-bit
      # value; read it from the dashboard. Never commit it here.
      - key: QUANTLAB_ADMIN_TOKEN
        generateValue: true
      # Requests reach the app via Cloudflare then Render's load balancer.
      # X-Forwarded-For is unsafe in both directions here: the left end is
      # client-written, the right end comes from rotating proxy pools. Both
      # let a client escape the rate limit. CF-Connecting-IP is set and
      # overwritten by Cloudflare on every request.
      - key: QUANTLAB_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: QUANTLAB_TRUST_PROXY_HOPS
        value: "0"
      - key: QUANTLAB_RATE_LIMIT
        value: "20"
      - key: QUANTLAB_RATE_WINDOW
        value: "60"
      - key: QUANTLAB_MAX_INFLIGHT
        value: "8"
