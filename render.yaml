services:
  - type: web
    name: quantlab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker, deliberately. Jobs live in process memory, so a second
    # worker would 404 a job that is running perfectly well in its sibling.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: QUANTLAB_DATA_ROOT
        value: sampledata
      # Free tiers have an ephemeral filesystem; /tmp is the writable spot.
      - key: QUANTLAB_CACHE_ROOT
        value: /tmp/quantlab-cache
      # Admin endpoints (/cache, /jobs). Render generates a random 256-bit
      # value; read it from the dashboard. Never commit it here.
      - key: QUANTLAB_ADMIN_TOKEN
        generateValue: true
      # Requests reach the app via Cloudflare then Render's load balancer.
      # X-Forwarded-For is unsafe in both directions here: the left end is
      # client-written, the right end comes from rotating proxy pools. Both
      # let a client escape the rate limit. CF-Connecting-IP is set and
      # overwritten by Cloudflare on every request.
      - key: QUANTLAB_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: QUANTLAB_TRUST_PROXY_HOPS
        value: "0"
      - key: QUANTLAB_RATE_LIMIT
        value: "20"
      - key: QUANTLAB_RATE_WINDOW
        value: "60"
      - key: QUANTLAB_MAX_INFLIGHT
        value: "8"
      # Postgres for finished runs. Unset falls back to SQLite on the
      # ephemeral disk, which forgets everything on each restart or deploy.
      # On Supabase use the *Session pooler* string (port 5432): Render has
      # no IPv6, and the direct connection is IPv6-only.
      # sync: false — Render asks for the value; it is never in this file.
      - key: DATABASE_URL
        sync: false
      # Supabase Auth. Unset SUPABASE_URL = accounts off, all anonymous.
      # The publishable key is meant to be public; it ships to browsers.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: QUANTLAB_USER_RATE_LIMIT
        value: "60"
      # Backtests per rolling 24 hours: per visitor address, per account.
      - key: QUANTLAB_DAILY_LIMIT
        value: "50"
      - key: QUANTLAB_USER_DAILY_LIMIT
        value: "200"
      # AI research. Unset key = feature off. Set a monthly spend limit on
      # the key in the Anthropic console as well: these caps bound usage,
      # the console caps the bill.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Or DeepSeek, through its Anthropic-compatible endpoint. With this
      # key set, research uses DeepSeek (deepseek-flash) unless
      # QUANTLAB_RESEARCH_PROVIDER says otherwise.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: QUANTLAB_RESEARCH_DAILY_LIMIT
        value: "3"
      - key: QUANTLAB_RESEARCH_GLOBAL_DAILY_LIMIT
        value: "50"
      - key: QUANTLAB_RUN_RETENTION_DAYS
        value: "30"
